<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block head_title %}
            TrueNorth Analytics
        {% endblock %}
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.3" integrity="sha384-0895/pl2MU10Hqc6jd4RvrthNlDiE9U1tWmX7WRESftEDRosgxNsQG/Ze9YMRzHq" crossorigin="anonymous"></script>

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#f7f6f3',
                        ink: '#1c1b18',
                        maple: { DEFAULT: '#b3372b', dark: '#8f2b22' },
                        border: '#e7e4dc',
                        muted: '#8a857a',
                        muted2: '#6f6b60',
                        faint: '#a8a396',
                        pos: '#1a7f4e',
                        neg: '#c23934',
                    },
                    fontFamily: {
                        sans: ["'IBM Plex Sans'", 'system-ui', 'sans-serif'],
                        mono: ["'IBM Plex Mono'", 'ui-monospace', 'monospace'],
                        serif: ["'Instrument Serif'", 'Georgia', 'serif'],
                    },
                }
            }
        }
    </script>

    <!-- Custom files -->
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">

    {% block extra_head %}
    {% endblock %}
</head>
<body class="bg-paper text-ink font-sans">
    {% include 'nav.html' %}

    <div class="max-w-screen-xl mx-auto px-9 py-7">
        {% block content %}
        {% endblock content %}
    </div>

    <script src="{{ url_for('static', filename='js/help_tips.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/row_links.js') }}" defer></script>
</body>
</html>
