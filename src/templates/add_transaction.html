{% extends "base.html" %}

{% block head_title %}
   Agregar transacción | TrueNorth Analytics
{% endblock %}

{% block content %}

<h1 class="font-serif-display text-3xl text-ink mb-6">Agregar transacción</h1>

<div class="card p-6 max-w-lg">
    <form method="POST" hx-post="/transactions/add" hx-swap="outerHTML" class="space-y-4">

        <div class="space-y-1.5">
            <label for="date" class="text-[13px] text-muted2">Fecha</label>
            <input type="date" name="date" id="date" class="tn-input" required />
        </div>

        <div class="space-y-1.5">
            <label for="category" class="text-[13px] text-muted2">Categoría</label>
            <select name="category" id="category" class="tn-input">
                <option value="Bills">Bills</option>
                <option value="Food">Food</option>
                <option value="Clothes">Clothes</option>
                <option value="Medical">Medical</option>
                <option value="Housing">Housing</option>
                <option value="Salary">Salary</option>
                <option value="Social">Social</option>
                <option value="Vacation">Vacation</option>
                <option value="Others">Others</option>
            </select>
        </div>

        <div class="space-y-1.5">
            <label for="type" class="text-[13px] text-muted2">Tipo</label>
            <select name="type" id="type" class="tn-input">
                <option value="EXPENSE">EXPENSE</option>
                <option value="INCOME">INCOME</option>
            </select>
        </div>

        <div class="space-y-1.5">
            <label for="amount" class="text-[13px] text-muted2">Monto</label>
            <input type="number" name="amount" id="amount" class="tn-input" placeholder="Ingresa un monto..." required />
        </div>

        <div class="space-y-1.5">
            <label for="description" class="text-[13px] text-muted2">Descripción</label>
            <textarea name="description" class="tn-input" rows="3" placeholder="Ingresa una descripción"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Agregar transacción</button>
    </form>
</div>
{% endblock %}
