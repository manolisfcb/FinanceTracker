{# Company page "Comunidad" tab: the same cards, scoped to one ticker. #}
<div class="flex flex-col gap-3">
    {% for entry in entries %}
        {% include 'partials/community_post_card.html' %}
    {% else %}
    <div class="card p-8 text-center">
        <div class="text-sm font-semibold text-ink mb-1">Nadie habló de {{ asset.symbol }} todavía</div>
        <div class="text-[13px] text-muted mb-4">
            Mencioná <span class="tick">${{ asset.symbol }}</span> en una publicación y aparecerá acá.
        </div>
        <a href="{{ url_for('community.community_page') }}" class="btn">Ir a la comunidad</a>
    </div>
    {% endfor %}
</div>
