{% for category, message in get_flashed_messages(with_categories=true) %}
<div class="tn-alert {{ 'tn-alert-danger' if category == 'danger' else 'tn-alert-success' if category == 'success' else 'tn-alert-info' }}">
    <span>{{ message }}</span>
    <button type="button" onclick="this.closest('.tn-alert').remove()" class="text-current opacity-60 hover:opacity-100" aria-label="Close">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
    </button>
</div>
{% endfor %}
