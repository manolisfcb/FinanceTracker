{# Vote controls + comment count. Swapped in place by HTMX after a vote, so
   the surrounding post card never re-renders. #}
<div id="post-actions-{{ post.id }}" class="flex items-center gap-[18px]">
    <button type="button" class="vote {{ 'vote-on-up' if user_vote == 1 }}"
            aria-label="Votar a favor" aria-pressed="{{ 'true' if user_vote == 1 else 'false' }}"
            data-i18n-aria-label="community.vote_up_aria"
            hx-post="{{ url_for('community.vote_post', post_id=post.id) }}"
            hx-vals='{"value": 1}'
            hx-target="#post-actions-{{ post.id }}"
            hx-swap="outerHTML">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path></svg>
        <span class="num {{ 'pos' if score > 0 else 'neg' if score < 0 }}">{{ score }}</span>
    </button>

    <button type="button" class="vote {{ 'vote-on-down' if user_vote == -1 }}"
            aria-label="Votar en contra" aria-pressed="{{ 'true' if user_vote == -1 else 'false' }}"
            data-i18n-aria-label="community.vote_down_aria"
            hx-post="{{ url_for('community.vote_post', post_id=post.id) }}"
            hx-vals='{"value": -1}'
            hx-target="#post-actions-{{ post.id }}"
            hx-swap="outerHTML">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14"></path><path d="M19 12l-7 7-7-7"></path></svg>
    </button>

    <a href="{{ url_for('community.post_page', post_id=post.id) }}" class="vote">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.3 8.6 8.6 0 0 1-3.7-.8L3 21l2-5.5a8.2 8.2 0 0 1-1-3.9A8.4 8.4 0 0 1 12.5 3.3 8.4 8.4 0 0 1 21 11.5z"></path></svg>
        <span class="num">{{ comment_count }} <span data-i18n="{{ 'community.comment_singular' if comment_count == 1 else 'community.comment_plural' }}">{{ 'comentario' if comment_count == 1 else 'comentarios' }}</span></span>
    </a>
</div>
