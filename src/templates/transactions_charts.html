{% extends "base.html" %}

{% block head_title %}
    Gráficos | TrueNorth Analytics
{% endblock %}

{% block content %}
{% include 'partials/flash_messages.html' %}

<h1 class="font-serif-display text-3xl text-ink mb-6">Gráficos de transacciones</h1>

<div class="grid grid-cols-1 md:grid-cols-4 gap-5">
    <!-- BLOQUES DE GRAFICAS -->
    <div class="md:col-span-3">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
            <div class="card p-5">
                <div class="text-sm font-semibold mb-3">Ingresos vs Gastos</div>
                <canvas id="incomeExpenseChart"></canvas>
            </div>

            <div class="card p-5">
                <div class="text-sm font-semibold mb-3">Composición por categorías</div>
                <canvas id="categoryCompositionChart"></canvas>
            </div>
        </div>
    </div>

    <!-- FILTROS -->
    <div class="md:col-span-1">
        <div class="card p-5">
            <div class="lbl mb-3">Filtros</div>
            <form method="GET" class="space-y-4">
                <div class="space-y-1.5">
                    <label for="date" class="text-[13px] text-muted2">Fecha</label>
                    <input type="date" name="date" id="date" class="tn-input" placeholder="YYYY-MM-DD" />
                </div>

                <div class="space-y-1.5">
                    <label for="type" class="text-[13px] text-muted2">Tipo</label>
                    <input type="text" name="type" id="type" class="tn-input" placeholder="income o expense..." />
                </div>

                <div class="space-y-1.5">
                    <label class="text-[13px] text-muted2">Categorías</label>
                    <div class="space-y-1.5">
                        {% for categ in categories %}
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="category-{{ categ.id }}" name="categories" value="{{ categ.name }}" style="accent-color:#b3372b" />
                            <label for="category-{{ categ.id }}" class="text-[13px]">{{ categ.name }}</label>
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-full justify-center">Buscar</button>
            </form>
        </div>
    </div>
</div>

<!-- Scripts para creación de los gráficos -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    Chart.defaults.font.family = "'IBM Plex Sans', sans-serif";
    Chart.defaults.color = '#6f6b60';
    const tnGridColor = '#efede7';

    // Ingresos vs Gastos (Bar Chart)
    const incomeExpenseCtx = document.getElementById('incomeExpenseChart').getContext('2d');
    new Chart(incomeExpenseCtx, {
        type: 'bar',
        data: {
            labels: {{ income_expense_labels|tojson }},
            datasets: [
                {
                    label: 'Ingresos',
                    data: {{ income_data|tojson }},
                    backgroundColor: '#1a7f4e',
                    borderRadius: 3,
                },
                {
                    label: 'Gastos',
                    data: {{ expense_data|tojson }},
                    backgroundColor: '#c23934',
                    borderRadius: 3,
                },
            ],
        },
        options: {
            responsive: true,
            scales: {
                x: { grid: { display: false } },
                y: { beginAtZero: true, grid: { color: tnGridColor } },
            },
        },
    });

    // Composición por Categorías (Pie Chart)
    const categoryCtx = document.getElementById('categoryCompositionChart').getContext('2d');
    new Chart(categoryCtx, {
        type: 'pie',
        data: {
            labels: {{ category_labels|tojson }},
            datasets: [{
                data: {{ category_data|tojson }},
                backgroundColor: ['#b3372b', '#b98a2e', '#1a7f4e', '#4a6b8a', '#7d5ba6'],
                borderWidth: 0,
            }],
        },
        options: {
            responsive: true,
        },
    });
</script>
{% endblock %}
