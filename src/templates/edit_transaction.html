{% extends "base.html" %}

{% block head_title %}
   Editar transacción | TrueNorth Analytics
{% endblock %}

{% block content %}

<h1 class="font-serif-display text-3xl text-ink mb-6" data-i18n="finance.transaction.edit_title">Editar transacción</h1>

<div class="card p-6 max-w-lg">
    <form method="PUT" hx-post="/transactions/add" hx-swap="outerHTML" class="space-y-4">

        <div class="space-y-1.5">
            <label for="date" class="text-[13px] text-muted2" data-i18n="finance.form.date_label">Fecha</label>
            <input type="date" name="date" id="date" class="tn-input" value="{{transaction.date.strftime('%Y-%m-%d') }}" required />
        </div>

        <div class="space-y-1.5">
            <label for="category" class="text-[13px] text-muted2" data-i18n="finance.form.category_label">Categoría</label>
            <select name="category" id="category" class="tn-input" value="{{transaction.category_id }}">
                <option value="Bills" data-i18n="finance.category.bills">Bills</option>
                <option value="Food" data-i18n="finance.category.food">Food</option>
                <option value="Clothes" data-i18n="finance.category.clothes">Clothes</option>
                <option value="Medical" data-i18n="finance.category.medical">Medical</option>
                <option value="Housing" data-i18n="finance.category.housing">Housing</option>
                <option value="Salary" data-i18n="finance.category.salary">Salary</option>
                <option value="Social" data-i18n="finance.category.social">Social</option>
                <option value="Vacation" data-i18n="finance.category.vacation">Vacation</option>
                <option value="Others" data-i18n="finance.category.others">Others</option>
            </select>
        </div>

        <div class="space-y-1.5">
            <label for="type" class="text-[13px] text-muted2" data-i18n="finance.form.type_label">Tipo</label>
            <select name="type" id="type" class="tn-input" value="{{transaction.type }}">
                <option value="EXPENSE" data-i18n="finance.type.expense">EXPENSE</option>
                <option value="INCOME" data-i18n="finance.type.income">INCOME</option>
            </select>
        </div>

        <div class="space-y-1.5">
            <label for="amount" class="text-[13px] text-muted2" data-i18n="finance.form.amount_label">Monto</label>
            <input type="number" name="amount" id="amount" class="tn-input" placeholder="Ingresa un monto..." data-i18n-placeholder="finance.form.amount_placeholder" value="{{ transaction.amount }}" required />
        </div>

        <div class="space-y-1.5">
            <label for="description" class="text-[13px] text-muted2" data-i18n="finance.form.description_label">Descripción</label>
            <textarea name="description" class="tn-input" rows="3" placeholder="Ingresa una descripción" data-i18n-placeholder="finance.form.description_placeholder">{{ transaction.description }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary" data-i18n="finance.transaction.save_changes">Guardar cambios</button>
    </form>
</div>
{% endblock %}
