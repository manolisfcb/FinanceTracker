name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # uv es la única fuente de verdad de dependencias: resuelve desde
      # uv.lock, igual que el Dockerfile. Antes el CI instalaba por
      # requirements-dev.txt y el contenedor por requirements.txt — dos listas
      # que podían divergir sin que nada avisara.
      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.26"
          enable-cache: true

      # La versión sale de .python-version, el mismo archivo que usa el venv
      # local, y coincide con la imagen.
      - name: Instalar dependencias
        run: uv sync --frozen --dev

      # --frozen ya falla si el lock no concuerda con pyproject.toml; esto lo
      # deja explícito en su propio paso para que el error se lea de una.
      - name: Verificar que uv.lock esté al día
        run: uv lock --check

      - name: Lint (ruff)
        run: uv run ruff check src app.py config.py tests

      - name: Test (pytest)
        env:
          ENV: testing
          SECRET_KEY: ci-testing-secret-key
          JWT_SECRET_KEY: ci-testing-jwt-key
        run: uv run pytest tests/ -v
